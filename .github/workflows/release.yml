name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write   # required by the optional container job (GitHub checks it even when skipped)

jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@e0aa772a12b91f8a37846b4efef5f44a963a6c47
    with:
      binaries: capnp-compiler,capnpc-cli,capnpc-mcp
      kind: cli
      app-id: net.freesynergy.CapnpCompiler
      description: Cap'n Proto parser and compiler in Rust (schema to CodeGeneratorRequest) and the capnpc-cli and capnpc-mcp plugins
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
