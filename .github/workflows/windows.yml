# The gate on the Windows runner (windows-2022): the compiler, the generator and the generated code are built and tested
# here, never cross-built (golden files, file names and line endings are the risks). Own steps instead of the reusable
# check.yml, which runs on Linux only. Same fs-release pin as the other workflows of this repository.
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy/fs-release/actions/setup-rust@v0.0.15
        with:
          components: rustfmt,clippy
          cache-key: windows
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      # the library without the command lines (and without capnpc) must build on Windows, too
      - run: cargo check --lib --no-default-features --locked
      - run: cargo test -p capnp-compiler-cligen-fixtures --locked
