# The library without the default feature `cli` has no `capnpc` (generated command line code needs only the library),
# and the package holds both binaries. Own workflow on every push (the `ci` workflow runs on main and pull requests only).
name: slim-lib
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  slim-lib:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy/fs-release/actions/setup-rust@v0.0.11
        with:
          cache-key: slim-lib
      - run: cargo check --lib --no-default-features --locked
      - name: the fixtures crate (generated code on the slim library) builds and passes
        run: cargo test -p capnp-compiler-cligen-fixtures --locked
      - name: capnpc is not in the tree without default features
        run: |
          cargo tree -e normal --no-default-features --locked -p capnp-compiler | tee tree.txt
          if grep -q 'capnpc v' tree.txt; then
            echo "capnpc is still a dependency without default features" >&2
            exit 1
          fi
      - name: the fixtures crate does not pull the default features back in
        run: |
          cargo tree -e normal --locked -p capnp-compiler-cligen-fixtures | tee fx.txt
          ! grep -q 'capnpc v' fx.txt
      - name: both binaries and the generator are in the package
        run: |
          cargo package --locked --list --allow-dirty > package.list
          grep -qx 'src/bin/capnpc-cli.rs' package.list
          grep -qx 'src/cligen/capnpc_cli.capnp' package.list
          ! grep -q 'capnpc-mcp' package.list
