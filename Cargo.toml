[package]
name = "capnp-compiler"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["FreeSynergy contributors <support@freesynergy.net>"]
description = "Cap'n Proto parser and compiler in pure Rust (schema to CodeGeneratorRequest); Rust code via capnpc; generators for command line code and MCP tool tables"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FreeSynergy/fs-capnpc"
readme = "README.md"
include = ["/src/**", "/std/**", "/examples/**", "/Cargo.toml", "/README.md", "/DESIGN.md", "/CHANGELOG.md", "/NOTICE", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["capnp", "capnproto", "schema", "compiler", "codegen"]
categories = ["development-tools", "encoding", "parser-implementations"]

[workspace]
members = [".", "crates/cligen-fixtures"]
resolver = "3"

[features]
default = ["cli"]
# The command lines `capnp-compiler`, `capnpc-cli` and `capnpc-mcp` (and the Rust code generator capnpc for `-o`).
# Without it the library has no `capnpc`; `cligen` (the generator and its runtime part `rt`) is always there.
cli = ["dep:capnpc"]

[lib]
name = "capnp_compiler"
path = "src/lib.rs"

[[bin]]
name = "capnp-compiler"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "capnpc-cli"
path = "src/bin/capnpc-cli.rs"
required-features = ["cli"]

[[bin]]
name = "capnpc-mcp"
path = "src/bin/capnpc-mcp.rs"
required-features = ["cli"]

[dependencies]
capnp = "0.27.3"
capnpc = { version = "0.27.0", optional = true }

[dev-dependencies]
capnpc = "0.27.0"
capnpc-embedded = "0.2"
