[package]
name = "capnpc-cli-fixtures"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["FreeSynergy contributors <support@freesynergy.net>"]
description = "Test crate of capnpc-cli: compiles the fixture schemas with capnp-compiler, capnpc and capnpc-cli and checks that the result compiles and runs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
capnp = "0.27.3"
capnp-rpc = "0.27.3"
capnpc-cli = { path = "../capnpc-cli" }
futures = "0.3"

[build-dependencies]
capnp-compiler = { path = "../.." }
capnpc = "0.27.0"
capnpc-cli = { path = "../capnpc-cli" }
